# The launcher icon: the Climate Dashboard mark (lib/widgets/product_mark.dart and the web apps'
# ProductMark). The source images in assets/icon/ are drawn from the same SVG.
# Regenerate after changing them:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  # Android 8+ adaptive icon: the launcher crops the layers to its own shape
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  ios: true
  image_path_ios: "assets/icon/icon_square.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1F3864"
    theme_color: "#1F3864"
