# Web server inside the frontend image. It serves the built single-page app and forwards API,
# admin and static requests to the backend, so the app also works when its port is opened
# directly (development and staging, CD-4.08). In production the outer nginx answers /api/ first.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Docker's built-in DNS. Looking the backend up per request (variable in proxy_pass) lets this
    # container start even when the backend is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }

    # The built files carry a hash of their content in their name, so a file never changes and the
    # browser may keep it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes such as /login must return the app, not a 404, on refresh. The page itself
    # is checked with the server on every visit (no-cache), so a new build shows at once: without it
    # a browser guesses how long to keep the page and can show an old build for hours.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
